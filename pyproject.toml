[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-daemon"
version = "1.0.0"
description = "A local-first finance controller for three-way reconciliation, human exception review, and independently verifiable evidence."
readme = "README.md"
keywords = ["reconciliation", "finance", "audit", "proof-carrying"]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # stdlib only — offline by design

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]
validate = ["splink>=4.0", "rapidfuzz>=3.0"]  # independent cross-check + accel; never load-bearing
readers = []  # optional evidence readers talk stdlib HTTP to a local daemon: no package, no default

[project.scripts]
ledger-daemon = "ledger_daemon.cli:main"

[tool.setuptools.packages.find]
include = ["ledger_daemon*"]

[tool.setuptools.package-data]
ledger_daemon = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by contract: no test may require a key, a model or a socket.
addopts = "-q"
