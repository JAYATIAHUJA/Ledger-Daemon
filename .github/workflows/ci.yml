name: ci

# The offline core is the contract: no keys, no model, no network service.
# Every job below must pass without a single credential in the environment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: offline core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor the package declares, and the newest stable release
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .[dev]

      # The judge runs first so the docs contract can check the published
      # claims against a freshly generated artifact rather than a stale one.
      - name: Judge (smoke)
        run: python -m ledger_daemon judge --seed 42 --n 100 --out out/ci-judge

      - name: Tests
        run: python -m pytest -q

      - name: Demo runs end to end offline
        run: python -m ledger_daemon demo --seed 42 --n 500 --out out/ci-demo

      - name: Upload judge artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-py${{ matrix.python-version }}
          path: out/ci-judge
          if-no-files-found: warn

  package:
    name: package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build

  # Optional and never required: a local model or live test-mode credentials
  # change nothing about whether the core is correct. This job is dispatch-only
  # so a missing secret can never fail a pull request.
  optional-integrations:
    name: optional model and test-mode integrations
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .[dev]
      - name: Score the evidence readers
        run: python -m ledger_daemon bench-readers --out out/ci-readers
      - name: Independent matcher cross-check
        run: |
          python -m pip install -e .[validate]
          python -m ledger_daemon crosscheck --seed 42 --n 200 --out out/ci-crosscheck
